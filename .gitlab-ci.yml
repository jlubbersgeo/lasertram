default:
    image: python:3.13
    cache:
        paths:
            - .pip-cache/
    before_script:
        - python --version
        - pip install --upgrade pip
        - pip install build twine

stages:
    - build
    - test
    - publish-testpypi
    - publish-pypi

build: 
    stage: build
    script:
        - python -m build
    artifacts:
        paths:
            - dist/

test:
    stage: test
    dependencies:
        - build
    script:
        - pip install pytest coverage
        - pip install dist/*.whl
        - coverage run -m pytest
        - coverage report
    coverage: '/(?i)total.*? (100(?:\.0+)?\%|[1-9]?\d(?:\.\d+)?\%)$/'
    artifacts:
        reports:
            coverage_report:
                coverage_format: cobertura
                path: coverage.xml
        paths:
            - htmlcov/

publish-testpypi:
    stage: publish-testpypi
    dependencies:
        - build
    script:
        - echo "Uploading to Test PyPI"
        - TWINE_PASSWORD=${TEST_PYPI_TOKEN} TWINE_USERNAME=__token__ python -m twine upload --repository testpypi dist/*
    rules:
        - if: $CI_COMMIT_TAG

publish-pypi:
    stage: publish-pypi
    dependencies:
        - build
    script:
        - echo "Uploading to PyPI"
        - TWINE_PASSWORD=${PYPI_TOKEN} TWINE_USERNAME=__token__ python -m twine upload dist/*
    rules:
        - if: $CI_COMMIT_TAG
        



